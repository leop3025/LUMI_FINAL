<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Memory Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .wave {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(to bottom, #93c5fd, #e0f2fe);
      z-index: -1;
    }

    .card-wrapper {
      perspective: 1000px;
    }

    .card-inner {
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .card-front {
      background-color: white;
      color: #1e3a8a;
      border: 2px solid #3b82f6;
    }

    .card-back {
      background-color: #3b82f6;
      color: white;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-blue-50 min-h-screen relative">

  <div class="wave"></div>

  <!-- Header -->
  <header class="flex justify-between items-center p-4 bg-white shadow-md relative z-10">
    <div class="flex items-center">
      <img alt="Lumi logo" class="rounded-full w-10 h-10" src="https://placehold.co/40x40/0066cc/ffffff?text=LL">
      <h1 class="text-blue-600 text-xl font-bold ml-2">Learning with <span class="text-blue-800">Lumi</span></h1>
    </div>
    <nav class="flex space-x-4">
      <a class="text-blue-800 hover:text-blue-600" href="index.html">Home</a>
      <a class="text-blue-800 hover:text-blue-600" href="learn.html">Learn</a>
      <a class="text-blue-800 hover:text-blue-600" href="practice.html">Practice</a>
      <a class="text-blue-800 hover:text-blue-600" href="profile.html">Profile</a>
    </nav>
    <div class="flex items-center">
      <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full shadow">3 day streak</span>
      <img alt="User profile picture" class="rounded-full w-10 h-10 ml-2" src="https://placehold.co/40x40">
    </div>
  </header>

  <!-- Title -->
  <main class="max-w-4xl mx-auto mt-8 p-4">
    <h2 class="text-3xl font-bold text-center text-blue-800 mb-6">🧠 Memory Game</h2>
    <p class="text-center text-blue-600 mb-6">Click on the cards to match Spanish words with their English meanings!</p>

    <!-- Game Grid -->
    <div id="gameBoard" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
    <div id="status" class="text-center mt-6 text-blue-800 font-semibold"></div>
  </main>

  <!-- Modal -->
  <div id="winModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm w-full">
      <h3 class="text-2xl font-bold text-blue-800 mb-4">🎉 Congrats!</h3>
      <p class="text-blue-600 mb-6">You've matched all the cards!</p>
      <a href="practice.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-semibold">Back to Practice</a>
    </div>
  </div>

  <script>
    const wordPairs = [
      { spanish: "gato", english: "cat" },
      { spanish: "perro", english: "dog" },
      { spanish: "rojo", english: "red" },
      { spanish: "casa", english: "house" },
      { spanish: "libro", english: "book" },
      { spanish: "agua", english: "water" }
    ];

    let cards = [];
    let flipped = [];
    let matched = 0;

    const gameBoard = document.getElementById("gameBoard");
    const status = document.getElementById("status");
    const winModal = document.getElementById("winModal");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function generateCards() {
      cards = [];
      wordPairs.forEach((pair, id) => {
        cards.push({ text: pair.spanish, pairId: id });
        cards.push({ text: pair.english, pairId: id });
      });

      shuffle(cards);
      gameBoard.innerHTML = "";
      matched = 0;

      cards.forEach((card, index) => {
        const cardWrapper = document.createElement("div");
        cardWrapper.className = "card-wrapper aspect-square";
        cardWrapper.dataset.index = index;
        cardWrapper.dataset.pairId = card.pairId;

        const cardInner = document.createElement("div");
        cardInner.className = "card-inner";

        const front = document.createElement("div");
        front.className = "card-front";
        front.textContent = "?";

        const back = document.createElement("div");
        back.className = "card-back";
        back.textContent = card.text;

        cardInner.appendChild(front);
        cardInner.appendChild(back);
        cardWrapper.appendChild(cardInner);
        gameBoard.appendChild(cardWrapper);

        cardWrapper.addEventListener("click", () => flipCard(cardWrapper, card.text));
      });
    }

    function flipCard(cardEl, text) {
      if (cardEl.classList.contains("flipped") || flipped.length === 2) return;

      cardEl.classList.add("flipped");
      flipped.push({ element: cardEl, text: text, pairId: cardEl.dataset.pairId });

      if (flipped.length === 2) {
        const [first, second] = flipped;

        if (first.pairId === second.pairId && first.element !== second.element) {
          matched++;
          flipped = [];
          if (matched === wordPairs.length) {
            setTimeout(() => {
              winModal.classList.remove("hidden");
            }, 500);
          }
        } else {
          setTimeout(() => {
            first.element.classList.remove("flipped");
            second.element.classList.remove("flipped");
            flipped = [];
          }, 1000);
        }
      }
    }

    generateCards();
  </script>
</body>
</html>
