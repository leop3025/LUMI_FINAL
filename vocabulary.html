<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocabulary Match</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .floating-xp {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 100;
      width: 200px;
    }
    
    .xp-progress {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin: 10px 0;
    }
    
    .xp-progress-bar {
      height: 100%;
      background: #3b82f6;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="wave"></div>

  <!-- Floating XP Bar -->
  <div class="floating-xp">
    <div class="flex justify-between items-center">
      <span class="text-blue-600 font-medium">Level 5</span>
      <span class="text-blue-600">300/500 XP</span>
    </div>
    <div class="text-center text-sm text-blue-600">
      <i class="fas fa-star mr-1"></i> Next Level: 200 XP
    </div>
  </div>

  <!-- Header -->
  <header class="flex justify-between items-center p-4 bg-white shadow-md relative z-10">
    <div class="flex items-center">
      <img alt="Lumi logo" class="rounded-full w-10 h-10" src="https://placehold.co/40x40/0066cc/ffffff?text=LL">
      <h1 class="text-blue-600 text-xl font-bold ml-2">Learning with <span class="text-blue-800">Lumi</span></h1>
    </div>
    <nav class="flex space-x-4">
      <a class="text-blue-800 hover:text-blue-600" href="index.html">Home</a>
      <a class="text-blue-800 hover:text-blue-600" href="learn.html">Learn</a>
      <a class="text-white bg-blue-500 px-4 py-2 rounded-full aqua-btn hover:bg-blue-600" href="practice.html">Practice</a>
      <a class="text-blue-800 hover:text-blue-600" href="profile.html">Profile</a>
    </nav>
    <div class="flex items-center">
      <img alt="User profile picture" class="rounded-full w-10 h-10" src="https://placehold.co/40x40">
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto mt-8 p-4 relative z-10">
    <h2 class="text-3xl font-bold text-center mb-6 text-blue-800">Vocabulary Match</h2>
    <p class="text-center text-blue-600 mb-6">Match the Spanish word with the correct English meaning.</p>

    <form id="matchForm" class="space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow aqua-card">
        <span class="text-blue-800 font-medium">Gato</span>
        <select name="gato" class="border px-3 py-2 rounded-lg text-blue-700">
          <option value="">Choose</option>
          <option value="cat">Cat</option>
          <option value="dog">Dog</option>
          <option value="house">House</option>
        </select>
      </div>

      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow aqua-card">
        <span class="text-blue-800 font-medium">Perro</span>
        <select name="perro" class="border px-3 py-2 rounded-lg text-blue-700">
          <option value="">Choose</option>
          <option value="cat">Cat</option>
          <option value="dog">Dog</option>
          <option value="house">House</option>
        </select>
      </div>

      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow aqua-card">
        <span class="text-blue-800 font-medium">Libro</span>
        <select name="libro" class="border px-3 py-2 rounded-lg text-blue-700">
          <option value="">Choose</option>
          <option value="book">Book</option>
          <option value="pen">Pen</option>
          <option value="notebook">Notebook</option>
        </select>
      </div>

      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow aqua-card">
        <span class="text-blue-800 font-medium">Casa</span>
        <select name="casa" class="border px-3 py-2 rounded-lg text-blue-700">
          <option value="">Choose</option>
          <option value="home">Home</option>
          <option value="window">Window</option>
          <option value="door">Door</option>
        </select>
      </div>

      <div class="text-center">
        <button type="button" onclick="checkAnswers()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full aqua-btn">Submit</button>
      </div>
    </form>

    <div id="result" class="text-center text-xl font-semibold mt-6 text-blue-700 hidden"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
