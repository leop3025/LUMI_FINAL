<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flashcards | AquaLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to bottom, #e0f2fe, #bae6fd);
      overflow-x: hidden;
    }

    /* Bubbles */
    .bubble {
      position: absolute;
      bottom: -100px;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: rise 8s infinite ease-in;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.6;
      }
      100% {
        transform: translateY(-800px) scale(0.8);
        opacity: 0;
      }
    }

    /* Fish animation */
    .fish {
      position: absolute;
      bottom: 100px;
      width: 80px;
      animation: swim 12s linear infinite;
    }

    .fish img {
      width: 100%;
    }

    @keyframes swim {
      0% {
        transform: translateX(-100px);
      }
      100% {
        transform: translateX(110vw);
      }
    }

    /* Flip cards */
    .flip-card {
      perspective: 1000px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 200px;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .flip-card-front {
      background-color: #dbeafe;
      color: #1e3a8a;
    }
    .flip-card-back {
      background-color: #1e3a8a;
      color: #dbeafe;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="relative overflow-hidden min-h-screen p-6">

  <!-- Floating Fish -->
  <div class="fish" style="left: -100px; animation-delay: 2s;">
    <img src="https://img.icons8.com/emoji/96/fish-emoji.png" alt="Fish">
  </div>
  <div class="fish" style="left: -150px; animation-delay: 6s;">
    <img src="https://img.icons8.com/emoji/96/tropical-fish.png" alt="Fish">
  </div>

  <!-- Bubbles -->
  <script>
    for (let i = 0; i < 20; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.style.left = Math.random() * 100 + 'vw';
      bubble.style.width = bubble.style.height = 10 + Math.random() * 20 + 'px';
      bubble.style.animationDuration = 6 + Math.random() * 4 + 's';
      bubble.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(bubble);
    }
  </script>

  <!-- Content -->
  <div class="relative z-10 max-w-4xl mx-auto">
    <header class="mb-10 text-center">
      <h1 class="text-4xl font-bold text-blue-800 mb-2">🔁 AquaLearn Flashcards</h1>
      <p class="text-blue-700">Hover over the cards to reveal the translations!</p>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Card 1 -->
      <div class="flip-card bg-white shadow-md rounded-xl p-4">
        <div class="flip-card-inner">
          <div class="flip-card-front">Hola</div>
          <div class="flip-card-back">Hello</div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="flip-card bg-white shadow-md rounded-xl p-4">
        <div class="flip-card-inner">
          <div class="flip-card-front">Gracias</div>
          <div class="flip-card-back">Thank you</div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="flip-card bg-white shadow-md rounded-xl p-4">
        <div class="flip-card-inner">
          <div class="flip-card-front">¿Dónde estás?</div>
          <div class="flip-card-back">Where are you?</div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="flip-card bg-white shadow-md rounded-xl p-4">
        <div class="flip-card-inner">
          <div class="flip-card-front">Buenos días</div>
          <div class="flip-card-back">Good morning</div>
        </div>
      </div>

      <!-- Card 5 -->
      <div class="flip-card bg-white shadow-md rounded-xl p-4">
        <div class="flip-card-inner">
          <div class="flip-card-front">¿Cuánto cuesta?</div>
          <div class="flip-card-back">How much does it cost?</div>
        </div>
      </div>

      <!-- Card 6 -->
      <div class="flip-card bg-white shadow-md rounded-xl p-4">
        <div class="flip-card-inner">
          <div class="flip-card-front">Te quiero</div>
          <div class="flip-card-back">I love you</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
