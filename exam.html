<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaLearn Student Exams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(to bottom, #e0f7fa, #b2ebf2, #80deea);
      min-height: 100vh;
    }

    .bubble {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float linear infinite;
      z-index: 0;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    .fish {
      position: absolute;
      z-index: 0;
      animation: swim linear infinite;
      font-size: 2rem;
    }

    @keyframes swim {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(calc(100vw + 100px)); }
    }

    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" fill="%230066cc"/><path d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z" opacity=".5" fill="%230066cc"/><path d="M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z" fill="%230066cc"/></svg>');
      background-size: cover;
      z-index: 0;
    }

    .aqua-card {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 102, 204, 0.1);
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 102, 204, 0.1);
      position: relative;
      overflow: hidden;
      z-index: 10;
    }

    .aqua-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 102, 204, 0.2);
    }

    .aqua-btn {
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .aqua-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 102, 204, 0.3);
    }
  </style>
</head>
<body>
  <div class="wave"></div>
  
  <div class="max-w-4xl mx-auto p-4 relative z-10 min-h-screen">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center">
        <img alt="AquaLearn logo" class="rounded-full w-10 h-10" src="https://placehold.co/40x40/0066cc/ffffff?text=AL"/>
        <h1 class="text-blue-600 text-xl font-bold ml-2">AquaLearn Student Exams</h1>
      </div>
      <div class="flex items-center space-x-2">
        <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm">Student</span>
        <img alt="Student avatar" class="rounded-full w-10 h-10" src="https://placehold.co/40x40"/>
      </div>
    </div>

    <!-- Exams Section -->
    <div class="aqua-card p-6">
      <h2 class="text-blue-600 text-lg font-bold mb-4">Available Exams</h2>
      <div id="examsContainer" class="space-y-4">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // Create bubbles
    function createBubbles() {
      const bubbleCount = 20;
      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        const size = Math.random() * 15 + 5;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 100}vw`;
        bubble.style.bottom = `-${size}px`;
        const duration = Math.random() * 10 + 5;
        bubble.style.animationDuration = `${duration}s`;
        bubble.style.animationDelay = `${Math.random() * 5}s`;
        document.body.appendChild(bubble);
      }
    }

    // Create fish
    function createFish() {
      const fishCount = 4;
      const fishTypes = ['🐠', '🐟', '🐡', '🦈'];
      for (let i = 0; i < fishCount; i++) {
        const fish = document.createElement('div');
        fish.classList.add('fish');
        fish.textContent = fishTypes[i % fishTypes.length];
        fish.style.fontSize = `${Math.random() * 20 + 30}px`;
        fish.style.top = `${Math.random() * 70 + 15}vh`;
        const duration = Math.random() * 20 + 20;
        fish.style.animationDuration = `${duration}s`;
        fish.style.animationDelay = `${Math.random() * 10}s`;
        document.body.appendChild(fish);
      }
    }

    // Populate exams
    function populateExams() {
      const examsContainer = document.getElementById('examsContainer');
      const exams = JSON.parse(localStorage.getItem('exams') || '[]');
      
      if (exams.length === 0) {
        examsContainer.innerHTML = '<p class="text-blue-600">No exams available yet. Check back later!</p>';
        return;
      }

      examsContainer.innerHTML = '';
      exams.forEach((exam, index) => {
        const examDiv = document.createElement('div');
        examDiv.className = 'p-4 bg-blue-50 rounded-lg';
        examDiv.innerHTML = `
          <h3 class="text-blue-600 font-bold">${exam.title}</h3>
          <p><b>Topic:</b> ${exam.topic}</p>
          <p><b>Type:</b> ${exam.questionType.replace('-', ' ').toUpperCase()}</p>
          <p><b>Questions:</b> ${exam.numQuestions}</p>
          <button class="aqua-btn bg-blue-500 text-white px-3 py-1 rounded-lg mt-2" onclick="viewExam(${index})">
            View Exam
          </button>
        `;
        examsContainer.appendChild(examDiv);
      });
    }

    // View exam details
    function viewExam(index) {
      const exams = JSON.parse(localStorage.getItem('exams') || '[]');
      const exam = exams[index];
      const examsContainer = document.getElementById('examsContainer');
      
      // Clear container and show exam form
      examsContainer.innerHTML = `
        <button class="aqua-btn bg-blue-100 text-blue-600 px-3 py-1 rounded-lg mb-4" onclick="populateExams()">
          <i class="fas fa-arrow-left mr-1"></i> Back to Exams
        </button>
        <div class="p-4 bg-blue-50 rounded-lg">
          <h3 class="text-blue-600 font-bold mb-2">${exam.title}</h3>
          <p><b>Topic:</b> ${exam.topic}</p>
          <p><b>Type:</b> ${exam.questionType.replace('-', ' ').toUpperCase()}</p>
          <p><b>Questions:</b> ${exam.numQuestions}</p>
          <form id="examForm" class="mt-4">
            ${exam.questions.map((q, qIndex) => `
              <div class="mb-6 p-4 bg-white rounded-lg">
                <h4 class="text-blue-600 font-bold mb-2">Question ${qIndex + 1}:</h4>
                <p class="mb-3">${q.questionText}</p>
                ${
                  exam.questionType === 'multiple-choice'
                    ? `
                      <div class="space-y-2">
                        ${q.options.map((opt, optIndex) => `
                          <div class="flex items-center">
                            <input type="radio" name="q${qIndex}" value="${optIndex}" id="q${qIndex}o${optIndex}" class="mr-2">
                            <label for="q${qIndex}o${optIndex}">${opt}</label>
                          </div>
                        `).join('')}
                      </div>
                    `
                    : `
                      <input type="text" name="q${qIndex}" class="input-field w-full p-3 rounded-lg" placeholder="Your answer">
                    `
                }
              </div>
            `).join('')}
            <button type="submit" class="aqua-btn bg-blue-500 text-white px-4 py-2 rounded-lg w-full">
              Submit Exam
            </button>
          </form>
        </div>
      `;

      // Add form submission handler
      document.getElementById('examForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const answers = [];
        let score = 0;
        
        // Process answers
        exam.questions.forEach((q, qIndex) => {
          const answer = formData.get(`q${qIndex}`);
          const isCorrect = exam.questionType === 'multiple-choice'
            ? q.options[answer] === q.answer
            : answer.toLowerCase().trim() === q.answer.toLowerCase().trim();
          
          if (isCorrect) score++;
          answers.push({
            question: q.questionText,
            studentAnswer: exam.questionType === 'multiple-choice' ? q.options[answer] : answer,
            correctAnswer: q.answer,
            isCorrect
          });
        });

        // Calculate percentage
        const percentage = Math.round((score / exam.numQuestions) * 100);
        
        // Show results
        examsContainer.innerHTML = `
          <button class="aqua-btn bg-blue-100 text-blue-600 px-3 py-1 rounded-lg mb-4" onclick="populateExams()">
            <i class="fas fa-arrow-left mr-1"></i> Back to Exams
          </button>
          <div class="p-4 bg-blue-50 rounded-lg">
            <h3 class="text-blue-600 font-bold mb-2">Exam Results</h3>
            <div class="text-center mb-6">
              <div class="text-4xl font-bold ${percentage >= 70 ? 'text-green-600' : 'text-red-600'}">${percentage}%</div>
              <p class="text-gray-600">${score} out of ${exam.numQuestions} correct</p>
            </div>
            <div class="space-y-4">
              ${answers.map((a, index) => `
                <div class="p-4 bg-white rounded-lg ${a.isCorrect ? 'border-l-4 border-green-500' : 'border-l-4 border-red-500'}">
                  <h4 class="font-bold mb-2">Question ${index + 1}:</h4>
                  <p class="mb-2">${a.question}</p>
                  <p class="mb-1"><b>Your answer:</b> ${a.studentAnswer}</p>
                  ${!a.isCorrect ? `<p class="text-green-600"><b>Correct answer:</b> ${a.correctAnswer}</p>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
    }

    // Initialize
    window.onload = function() {
      createBubbles();
      createFish();
      populateExams();
    };
  </script>
</body>
</html>
