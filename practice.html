<style>
  .chatbot-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }
  
  .chatbot-btn:hover {
    background: #2563eb;
    transform: scale(1.05);
  }
  
  .chatbot-btn i {
    font-size: 24px;
  }
</style>

<body>
  <button class="chatbot-btn" onclick="window.location.href='chatbot.html'">
    <i class="fas fa-robot"></i>
  </button>
</body>
